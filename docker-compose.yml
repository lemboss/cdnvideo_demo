services:
  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: "sqlite+aiosqlite:////data/cities.db"
      REDIS_URL: "redis://redis:6379/0"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      - city_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  city_data:
